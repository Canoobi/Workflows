name: Test E2E Playwright

on:
  workflow_call:
    inputs:
      node_version:
        required: false
        type: string
        default: '22'
      frontend_directory:
        required: false
        type: string
        default: Frontend
      build_command:
        required: false
        type: string
        default: 'npm run build-prod'
      test_command:
        required: false
        type: string
        default: 'npx playwright test'
      browsers:
        required: false
        type: string
        default: chromium
      report_path:
        required: false
        type: string
        default: playwright-report
      report_retention_days:
        required: false
        type: number
        default: 7

jobs:
  test-e2e-playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.frontend_directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ inputs.frontend_directory }}

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', inputs.frontend_directory)) }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install ${{ inputs.browsers }} --with-deps
        working-directory: ${{ inputs.frontend_directory }}

      - name: Install browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ inputs.browsers }}
        working-directory: ${{ inputs.frontend_directory }}

      - name: Build application
        run: ${{ inputs.build_command }}
        working-directory: ${{ inputs.frontend_directory }}

      - name: Run E2E tests
        run: ${{ inputs.test_command }}
        working-directory: ${{ inputs.frontend_directory }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ inputs.frontend_directory }}/${{ inputs.report_path }}
          retention-days: ${{ inputs.report_retention_days }}
          if-no-files-found: ignore
