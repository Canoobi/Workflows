name: Create Release

on:
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
        default: ""

    secrets:
      RELEASE_TOKEN:
        required: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          if [[ -z "$TAG" ]]; then
            echo "No tag given and the calling workflow did not run on a tag."
            exit 1
          fi

          # A re-run of the calling pipeline must not fail on a release that
          # the first run already created.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists in $GH_REPO, nothing to do."
            exit 0
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag

          echo "Created release $TAG in $GH_REPO"
