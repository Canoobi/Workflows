name: Check Authorization

on:
  workflow_call:

jobs:
  check-authorization:
    runs-on: ubuntu-latest

    steps:
      - name: Check authorization
        run: |
          ADMIN_USERS="${{ secrets.ADMIN_USERS }}"

          if [[ ! " $ADMIN_USERS " =~ " ${{ github.actor }} " ]]; then
            echo "You are not authorized to run this workflow."
            exit 1
          fi