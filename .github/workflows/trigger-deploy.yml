name: Trigger Deploy

on:
  workflow_call:
    inputs:
      container_names:
        required: false
        type: string
        default: ""

      run_pull_changes:
        required: false
        type: boolean
        default: true

      run_stop_compose_containers:
        required: false
        type: boolean
        default: false

      run_build_docker_compose_file:
        required: false
        type: boolean
        default: false

      run_start_compose_containers:
        required: false
        type: boolean
        default: false

      run_restart_non_compose_containers:
        required: false
        type: boolean
        default: false

    secrets:
      WORKFLOWS_REPO_TOKEN:
        required: true
      REPO_PATH:
        required: true

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment pipeline
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WORKFLOWS_REPO_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Canoobi/Workflows/actions/workflows/deployment-pipeline.yml/dispatches \
            -d '{
              "ref": "main",
              "inputs": {
                "source_repository": "${{ github.repository }}",
                "source_ref": "${{ github.ref_name }}",
                "source_sha": "${{ github.sha }}",
                "actor": "${{ github.actor }}",
                "repo_path": "${{ secrets.REPO_PATH }}",
                "container_names": "${{ inputs.container_names }}",
                "run_pull_changes": "${{ inputs.run_pull_changes }}",
                "run_stop_compose_containers": "${{ inputs.run_stop_compose_containers }}",
                "run_build_docker_compose_file": "${{ inputs.run_build_docker_compose_file }}",
                "run_start_compose_containers": "${{ inputs.run_start_compose_containers }}",
                "run_restart_non_compose_containers": "${{ inputs.run_restart_non_compose_containers }}"
              }
            }'