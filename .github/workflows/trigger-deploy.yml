name: Trigger Deploy

on:
  workflow_call:
    inputs:
      container_names:
        required: false
        type: string
        default: ""

      run_pull_changes:
        required: false
        type: boolean
        default: true

      run_stop_compose_containers:
        required: false
        type: boolean
        default: false

      run_build_docker_compose_file:
        required: false
        type: boolean
        default: false

      run_start_compose_containers:
        required: false
        type: boolean
        default: false

      run_restart_non_compose_containers:
        required: false
        type: boolean
        default: false

      # Leaving health_url empty skips the verification, which is what every
      # caller that does not set it gets. The two settings below then have no
      # effect. Repositories without an HTTP interface stay as they are.
      health_url:
        required: false
        type: string
        default: ""

      health_timeout_seconds:
        required: false
        type: number
        default: 180

      health_expected_status:
        required: false
        type: number
        default: 200

    secrets:
      WORKFLOWS_REPO_TOKEN:
        required: true
      REPO_PATH:
        required: true

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deployment pipeline
        id: trigger
        run: |
          RESPONSE=$(curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WORKFLOWS_REPO_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/Canoobi/Workflows/actions/workflows/deployment.yml/dispatches \
            -d '{
              "ref": "main",
              "return_run_details": true,
              "inputs": {
                "source_repository": "${{ github.repository }}",
                "actor": "${{ github.actor }}",
                "repo_path": "${{ secrets.REPO_PATH }}",
                "container_names": "${{ inputs.container_names }}",
                "run_pull_changes": "${{ inputs.run_pull_changes }}",
                "run_stop_compose_containers": "${{ inputs.run_stop_compose_containers }}",
                "run_build_docker_compose_file": "${{ inputs.run_build_docker_compose_file }}",
                "run_start_compose_containers": "${{ inputs.run_start_compose_containers }}",
                "run_restart_non_compose_containers": "${{ inputs.run_restart_non_compose_containers }}",
                "health_check": "${{ inputs.health_url != '' && format('{0}|{1}|{2}', inputs.health_url, inputs.health_timeout_seconds, inputs.health_expected_status) || '' }}"
              }
            }')

          echo "$RESPONSE"

          RUN_URL=$(echo "$RESPONSE" | jq -r '.run_url')
          HTML_URL=$(echo "$RESPONSE" | jq -r '.html_url')
          RUN_ID=$(echo "$RESPONSE" | jq -r '.workflow_run_id')

          if [[ "$RUN_URL" == "null" || -z "$RUN_URL" ]]; then
            echo "No workflow run URL returned."
            exit 1
          fi

          echo "Triggered deployment run: $HTML_URL"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"
          echo "html_url=$HTML_URL" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment pipeline
        run: |
          RUN_URL="${{ steps.trigger.outputs.run_url }}"
          HTML_URL="${{ steps.trigger.outputs.html_url }}"

          # 600s was calibrated for the five original deploy-changes /
          # stop-compose-containers / build-docker-compose-file /
          # start-compose-containers / restart-non-compose-containers jobs,
          # before verify-deployment-health existed as a sixth job. That job
          # adds its own runner queue/start-up time plus up to
          # health_timeout_seconds of polling on top of the original budget.
          # 30s covers runner start-up with margin -- together with the
          # default 180s health_timeout_seconds that matches the ~210s worst
          # case this was originally reviewed against. Added only when
          # health_url is set: an empty health_url skips the health job
          # entirely, so the original five-job budget is left unchanged.
          BASE_TIMEOUT_SECONDS=600
          RUNNER_STARTUP_OVERHEAD_SECONDS=30
          HEALTH_URL="${{ inputs.health_url }}"
          HEALTH_TIMEOUT_SECONDS="${{ inputs.health_timeout_seconds }}"
          # A workflow_call number input can render with a trailing ".0"
          # (see the same caveat in deployment.yml); bash arithmetic below
          # cannot parse that, so it is stripped defensively.
          HEALTH_TIMEOUT_SECONDS="${HEALTH_TIMEOUT_SECONDS%%.*}"
          if [[ -n "$HEALTH_URL" ]]; then
            TIMEOUT_SECONDS=$((BASE_TIMEOUT_SECONDS + RUNNER_STARTUP_OVERHEAD_SECONDS + HEALTH_TIMEOUT_SECONDS))
          else
            TIMEOUT_SECONDS=$BASE_TIMEOUT_SECONDS
          fi

          SLEEP_SECONDS=5
          START_TIME=$(date +%s)
          
          echo "Waiting for deployment pipeline:"
          echo "$HTML_URL"
          
          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED_SECONDS=$((CURRENT_TIME - START_TIME))
          
            if [[ "$ELAPSED_SECONDS" -ge "$TIMEOUT_SECONDS" ]]; then
              echo "Timeout after $TIMEOUT_SECONDS seconds while waiting for deployment pipeline."
              echo "$HTML_URL"
              exit 1
            fi
          
            RESPONSE=$(curl -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.WORKFLOWS_REPO_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$RUN_URL")
          
            STATUS=$(echo "$RESPONSE" | jq -r '.status')
            CONCLUSION=$(echo "$RESPONSE" | jq -r '.conclusion')
          
            echo "Deployment status: $STATUS, conclusion: $CONCLUSION, elapsed: ${ELAPSED_SECONDS}s"
          
            if [[ "$STATUS" == "completed" ]]; then
              if [[ "$CONCLUSION" == "success" ]]; then
                echo "Deployment pipeline finished successfully."
                exit 0
              else
                echo "Deployment pipeline failed with conclusion: $CONCLUSION"
                echo "$HTML_URL"
                exit 1
              fi
            fi
          
            sleep "$SLEEP_SECONDS"
          done